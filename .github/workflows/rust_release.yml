name: full-release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish, for example v0.1.0'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: full-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  await_rust_ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag_name: ${{ steps.release_ref.outputs.tag_name }}
      target_sha: ${{ steps.release_ref.outputs.target_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release ref
        id: release_ref
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/xlog/check_rust_release_tag.sh --tag "${RELEASE_TAG}"
          git fetch origin main
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          target_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git merge-base --is-ancestor "${target_sha}" origin/main
          echo "tag_name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

      - name: Require successful rust-ci run for tagged commit
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ steps.release_ref.outputs.target_sha }}
          TARGET_BRANCH: main
        with:
          script: |
            const workflowId = 'rust_ci.yml';
            const headSha = process.env.TARGET_SHA;
            const branch = process.env.TARGET_BRANCH;
            const maxAttempts = 90;
            const delayMs = 20_000;

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                head_sha: headSha,
                branch,
                event: 'push',
                per_page: 20,
              });

              const runs = data.workflow_runs ?? [];
              const latestRun = runs[0];
              if (latestRun?.status === 'completed' && latestRun.conclusion === 'success') {
                core.info(
                  `rust-ci passed for ${headSha} via run ${latestRun.html_url}`,
                );
                return;
              }

              if (latestRun && latestRun.status !== 'completed') {
                core.info(
                  `rust-ci still running for ${headSha}: status=${latestRun.status}, conclusion=${latestRun.conclusion ?? 'n/a'}, run=${latestRun.html_url}`,
                );
              } else if (latestRun) {
                core.setFailed(
                  `rust-ci for ${headSha} concluded ${latestRun.conclusion ?? 'unknown'}; release is blocked (${latestRun.html_url}).`,
                );
                return;
              } else {
                core.info(
                  `No rust-ci push run found for ${headSha} on ${branch} yet (attempt ${attempt}/${maxAttempts}).`,
                );
              }

              if (attempt < maxAttempts) {
                await new Promise((resolve) => setTimeout(resolve, delayMs));
              }
            }

            core.setFailed(
              `Timed out waiting for a successful rust-ci push run on ${headSha}.`,
            );

  rust_crates_release:
    needs:
      - await_rust_ci
    uses: ./.github/workflows/rust_crates_release.yml
    with:
      tag_name: ${{ needs.await_rust_ci.outputs.tag_name }}
    secrets: inherit

  cli_binary_release:
    needs:
      - await_rust_ci
    uses: ./.github/workflows/cli_binary_release.yml
    with:
      tag_name: ${{ needs.await_rust_ci.outputs.tag_name }}
    secrets: inherit

  brew_cask_release:
    needs:
      - await_rust_ci
      - cli_binary_release
    uses: ./.github/workflows/brew_cask_release.yml
    with:
      tag_name: ${{ needs.await_rust_ci.outputs.tag_name }}
    secrets: inherit

  npm_release:
    needs:
      - await_rust_ci
      - rust_crates_release
      - cli_binary_release
    uses: ./.github/workflows/npm_release.yml
    with:
      tag_name: ${{ needs.await_rust_ci.outputs.tag_name }}
    secrets: inherit
