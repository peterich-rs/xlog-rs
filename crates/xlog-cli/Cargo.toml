[package]
name = "mars-xlog-cli"
version = "0.1.0-preview.2"
edition = "2021"
license = "MIT"
description = "Command-line decoder for Tencent Mars xlog files."
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/mars-xlog-cli"
keywords = ["logging", "xlog", "decoder", "cli", "mars"]
categories = ["command-line-utilities", "development-tools::debugging"]

[[bin]]
name = "mars-xlog"
path = "src/main.rs"

[dependencies]
mars-xlog-core = { path = "../xlog-core", version = "0.1.0-preview.2" }
clap = { version = "4.5", features = ["derive"] }
thiserror = { workspace = true }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdh"] }
rand_core = "0.6"

[dev-dependencies]
tempfile = "3"
